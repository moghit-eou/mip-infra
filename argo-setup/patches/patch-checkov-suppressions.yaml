---
# Documented Checkov suppressions for the upstream Argo CD workloads.
# Neither is fixable on mip-infra side.
#
# CKV_K8S_38: the rule wants automountServiceAccountToken false. These
# components call the Kubernetes API and the token is how they authenticate,
# so turning it off breaks them. Upstream already sets false on repo-server
# and redis-ha-server, the two that never call the API.
#
# CKV_K8S_35: the Redis cache password, from secret argocd-redis key auth,
# injected as REDIS_PASSWORD or AUTH. The rule wants it mounted as a file,
# but Argo CD and the redis-ha containers only read it from the environment
# and offer no file option. That is upstream's design to change,
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  annotations:
    checkov.io/skip1: CKV_K8S_38=Component calls the Kubernetes API and needs the mounted token to authenticate
    checkov.io/skip2: CKV_K8S_35=Redis password is read from the REDIS_PASSWORD env var; upstream provides no file-based alternative
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-redis-ha-server
  annotations:
    checkov.io/skip1: CKV_K8S_35=Redis password is read from the AUTH env var; upstream provides no file-based alternative
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  annotations:
    checkov.io/skip1: CKV_K8S_38=Component calls the Kubernetes API and needs the mounted token to authenticate
    checkov.io/skip2: CKV_K8S_35=Redis password is read from the REDIS_PASSWORD env var; upstream provides no file-based alternative
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  annotations:
    checkov.io/skip1: CKV_K8S_35=Redis password is read from the REDIS_PASSWORD env var; upstream provides no file-based alternative
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis-ha-haproxy
  annotations:
    checkov.io/skip1: CKV_K8S_38=Component calls the Kubernetes API and needs the mounted token to authenticate
    checkov.io/skip2: CKV_K8S_35=Redis password is read from the AUTH env var; upstream provides no file-based alternative
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
  annotations:
    checkov.io/skip1: CKV_K8S_38=Component calls the Kubernetes API and needs the mounted token to authenticate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
  annotations:
    checkov.io/skip1: CKV_K8S_38=Component calls the Kubernetes API and needs the mounted token to authenticate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
  annotations:
    checkov.io/skip1: CKV_K8S_38=Component calls the Kubernetes API and needs the mounted token to authenticate